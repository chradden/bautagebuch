name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          capture_stdout: true
          debug: true
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "=== git pull ==="
            git pull origin main
            echo "=== docker down ==="
            docker compose down
            echo "=== docker build ==="
            docker compose build --no-cache
            echo "=== docker up ==="
            docker compose up -d --force-recreate
            docker image prune -f
            echo "✅ Bautagebuch Deploy abgeschlossen"
